
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GyoMail AI-powered email protection dashboard"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>GyoMail Popup</title>
  </head>

  <body>
    <main class="popup">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true"><img src="../../icons/icon48.png" alt="GyoMail Logo" /></div>

          <div>
            <h1>GyoMail</h1>
            <p>AI-powered email protection</p>
          </div>
        </div>

        <button
          class="settings-btn"
          type="button"
          aria-label="Settings"
          title="Settings"
        >
          ⚙
        </button>
      </header>

      <!-- Scan status -->
      <section class="scan-card" aria-labelledby="scan-title">
        <div class="scan-header">
          <div class="status-icon" aria-hidden="true">🛡</div>

          <div class="scan-info">
            <h2 id="scan-title">Inbox analysis</h2>
            <p>
              <span id="analyzed-count">0</span>
              emails analyzed
            </p>
          </div>

          <span
            class="status-dot"
            aria-label="GyoMail active"
            title="GyoMail active"
          ></span>
        </div>
      </section>

      <!-- Statistics -->
      <section class="stats" aria-label="Classification statistics">
        <div class="stat-card danger">
          <span class="stat-number" id="phishing-count">0</span>
          <span class="stat-label">Phishing</span>
        </div>

        <div class="stat-card warning">
          <span class="stat-number" id="suspicious-count">0</span>
          <span class="stat-label">Suspicious</span>
        </div>

        <div class="stat-card safe">
          <span class="stat-number" id="safe-count">0</span>
          <span class="stat-label">Legitimate</span>
        </div>
      </section>

      <!-- Recent analysis -->
      <section class="section" aria-labelledby="recent-title">
        <div class="section-header">
          <h2 id="recent-title">Recent analysis</h2>
          <button class="view-all" id="view-all-btn" type="button">
            View all
          </button>
        </div>

        <!-- popup.ts inserts the latest five results here -->
        <div id="recent-list" aria-live="polite">
          <p class="empty-state">No emails analyzed yet.</p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-status">
          <span class="status-dot" aria-hidden="true"></span>

          <div>
            <strong>GyoMail is active</strong>
            <p>Monitoring your inbox</p>
          </div>
        </div>

        <p class="footer-disclaimer">
          AI classifications can be wrong. Always verify suspicious emails.
        </p>
      </footer>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
